<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    
    <script>
        //callculator
        let num1; //create
        num1= Number(prompt("ENTER  FIRST NUMBER")); //aasign
        num2= Number(prompt("ENTER  LAST NUMBER"));

        //display
        document.write("<b>Addition: </b>", num1+ num2,"<br>");
        document.write("<b>sub: </b>", num1- num2,"<br>");
        document.write("<b>Divide: </b>", num1* num2,"<br>");
        document.write("<b>Multi: </b>", num1/ num2,"<br>");
        document.write("<b>Power multi: </b>", num1** num2,"<br>");

    </script>
</body>
</html>
